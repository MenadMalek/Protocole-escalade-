name: Synchronisation exacte temporaire

on:
  push:
    paths:
      - '.github/workflows/exact-sync-public.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer exactement la dernière version validée
        shell: bash
        run: |
          echo '' | base64 -d > index.html
          curl -fsSL https://raw.githubusercontent.com/MenadMalek/Protocole-escalade-/main/LICENSE.txt -o LICENSE.txt
      - name: Commit
        shell: bash
        run: |
          git config user.name "MenadMalek"
          git config user.email "malekounou@gmail.com"
          git add index.html LICENSE.txt
          git diff --cached --quiet && exit 0
          git commit -m "Synchroniser exactement le protocole avec la dernière version"
          git push
